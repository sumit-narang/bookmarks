name: mobile-e2e-android

on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/mobile/**
      - apps/backend/**
      - auth/**
      - collections/**
      - core/**
      - db/**
      - http/**
      - maestro/**
      - places/**
      - preferences/**
      - schema/**
      - scripts/mobileE2eAndroid.sh
      - scripts/mobileE2eAndroidShard.sh
      - share/**
      - sync/**
      - package.json
      - package-lock.json
      - .github/workflows/mobile-e2e-android.yml
  push:
    branches:
      - main
    paths:
      - apps/mobile/**
      - apps/backend/**
      - auth/**
      - collections/**
      - core/**
      - db/**
      - http/**
      - maestro/**
      - places/**
      - preferences/**
      - schema/**
      - scripts/mobileE2eAndroid.sh
      - scripts/mobileE2eAndroidShard.sh
      - share/**
      - sync/**
      - package.json
      - package-lock.json
      - .github/workflows/mobile-e2e-android.yml

concurrency:
  group: mobile-e2e-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-e2e-android-sharded:
    name: Maestro Runner Android e2e (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CI: "1"
      EXPO_NO_INTERACTIVE: "1"
      EXPO_PUBLIC_GOOGLE_PLACES_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_PLACES_API_KEY }}
      E2E_SHARD: ${{ matrix.shard }}
      E2E_ARTIFACT_ROOT: .bookmarks/e2e-artifacts/shard-${{ matrix.shard }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Install maestro-runner
        run: |
          curl -fsSL "https://open.devicelab.dev/install/maestro-runner" | bash

          if command -v maestro-runner >/dev/null 2>&1; then
            echo "$(dirname $(command -v maestro-runner))" >> "$GITHUB_PATH"
          elif [ -x "$HOME/.maestro-runner/bin/maestro-runner" ]; then
            export PATH="$HOME/.maestro-runner/bin:$PATH"
            echo "$HOME/.maestro-runner/bin" >> "$GITHUB_PATH"
          elif [ -x "$HOME/.local/bin/maestro-runner" ]; then
            export PATH="$HOME/.local/bin:$PATH"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          else
            echo "maestro-runner not found after installation!"
            exit 1
          fi

          maestro-runner --version

      - name: Write mobile e2e env
        run: |
          MAPS_KEY="${EXPO_PUBLIC_GOOGLE_PLACES_API_KEY:-test-key}"
          cat <<EOF > apps/mobile/.env
          EXPO_PUBLIC_GOOGLE_PLACES_API_KEY=${MAPS_KEY}
          EXPO_PUBLIC_BOOKMARKS_BACKEND_URL=http://127.0.0.1:8787
          EXPO_PUBLIC_BOOKMARKS_E2E_MODE=1
          EXPO_PUBLIC_BOOKMARKS_E2E_USER_A=e2e-user-a
          EXPO_PUBLIC_BOOKMARKS_E2E_USER_B=e2e-user-b
          EXPO_PUBLIC_BOOKMARKS_DEV_TEST_AUTH=1
          JAVA_HOME=${JAVA_HOME}
          EOF

      - name: Run maestro-runner shard on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 6144 -no-snapshot-load -no-snapshot-save
          script: bash scripts/mobileE2eAndroidShard.sh

      - name: Upload e2e artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-android-artifacts-shard-${{ matrix.shard }}
          if-no-files-found: warn
          path: |
            .bookmarks/e2e-artifacts/shard-${{ matrix.shard }}
