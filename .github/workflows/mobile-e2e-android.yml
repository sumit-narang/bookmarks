name: mobile-e2e-android

on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/mobile/**
      - apps/backend/**
      - auth/**
      - collections/**
      - core/**
      - db/**
      - http/**
      - maestro/**
      - places/**
      - preferences/**
      - schema/**
      - scripts/mobileE2eAndroid.sh
      - share/**
      - sync/**
      - package.json
      - package-lock.json
      - .github/workflows/mobile-e2e-android.yml
  push:
    branches:
      - main
    paths:
      - apps/mobile/**
      - apps/backend/**
      - auth/**
      - collections/**
      - core/**
      - db/**
      - http/**
      - maestro/**
      - places/**
      - preferences/**
      - schema/**
      - scripts/mobileE2eAndroid.sh
      - share/**
      - sync/**
      - package.json
      - package-lock.json
      - .github/workflows/mobile-e2e-android.yml

concurrency:
  group: mobile-e2e-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maestro-android:
    name: Maestro Android e2e
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: "1"
      EXPO_NO_INTERACTIVE: "1"
      EXPO_PUBLIC_GOOGLE_PLACES_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_PLACES_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Write mobile e2e env
        run: |
          MAPS_KEY="${EXPO_PUBLIC_GOOGLE_PLACES_API_KEY:-test-key}"
          cat <<EOF > apps/mobile/.env
          EXPO_PUBLIC_GOOGLE_PLACES_API_KEY=${MAPS_KEY}
          EXPO_PUBLIC_BOOKMARKS_BACKEND_URL=http://127.0.0.1:8787
          EXPO_PUBLIC_BOOKMARKS_E2E_MODE=1
          EXPO_PUBLIC_BOOKMARKS_E2E_USER_A=e2e-user-a
          EXPO_PUBLIC_BOOKMARKS_E2E_USER_B=e2e-user-b
          EXPO_PUBLIC_BOOKMARKS_DEV_TEST_AUTH=1
          JAVA_HOME=${JAVA_HOME}
          EOF

      - name: Run Maestro e2e suite on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            mkdir -p .bookmarks

            cleanup() {
              if [ -n "${METRO_PID:-}" ]; then
                kill "${METRO_PID}" >/dev/null 2>&1 || true
              fi
              if [ -n "${BACKEND_PID:-}" ]; then
                kill "${BACKEND_PID}" >/dev/null 2>&1 || true
              fi
            }
            trap cleanup EXIT

            adb reverse tcp:8081 tcp:8081
            adb reverse tcp:8787 tcp:8787

            npm run mobile:e2e:backend:start > .bookmarks/backend-e2e.log 2>&1 &
            BACKEND_PID=$!

            for attempt in $(seq 1 60); do
              if curl --fail --silent http://127.0.0.1:8787/health > /dev/null; then
                break
              fi

              if [ "$attempt" -eq 60 ]; then
                echo "Backend failed to become healthy."
                exit 1
              fi

              sleep 2
            done

            npm --workspace @bookmarks/mobile run start -- --dev-client --port 8081 --localhost --non-interactive > .bookmarks/metro.log 2>&1 &
            METRO_PID=$!

            for attempt in $(seq 1 90); do
              if curl --silent http://127.0.0.1:8081/status | grep -q "packager-status:running"; then
                break
              fi

              if [ "$attempt" -eq 90 ]; then
                echo "Metro failed to start."
                exit 1
              fi

              sleep 2
            done

            pushd apps/mobile/android > /dev/null
            ./gradlew assembleDebug --no-daemon
            popd > /dev/null

            adb install -r apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk

            npm run mobile:e2e:android

      - name: Upload e2e artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-android-artifacts
          if-no-files-found: warn
          path: |
            .bookmarks/e2e-artifacts
            .bookmarks/backend-e2e.log
            .bookmarks/metro.log
