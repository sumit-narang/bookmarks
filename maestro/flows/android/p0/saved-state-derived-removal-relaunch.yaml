appId: com.sumitnarang76.bookmarksmobile
---
- launchApp:
    clearState: true
- openLink: bookmarks://diagnostics
- tapOn:
    id: e2e-diagnostics-action-signin-user-a
- tapOn:
    id: e2e-diagnostics-action-create-place
- tapOn:
    id: e2e-diagnostics-action-create-collection-with-place
- tapOn:
    id: e2e-diagnostics-action-refresh
- assertVisible: "savedPlaces: 2"
- tapOn:
    id: e2e-diagnostics-action-remove-latest-place-memberships
- tapOn:
    id: e2e-diagnostics-action-refresh
- assertVisible: "savedPlaces: 1"
- stopApp
- launchApp
- openLink: bookmarks://diagnostics
- tapOn:
    id: e2e-diagnostics-action-refresh
- assertVisible: "savedPlaces: 1"
