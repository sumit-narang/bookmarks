appId: com.sumitnarang76.bookmarksmobile
---
- launchApp:
    clearState: true
- tapOn:
    text: "Close app"
    optional: true
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible:
      id: e2e-home-root
    timeout: 60000
- openLink: bookmarks://diagnostics
- openLink: bookmarks://diagnostics
- extendedWaitUntil:
    visible:
      id: e2e-diagnostics-action-refresh
    timeout: 60000
- scrollUntilVisible:
    element:
      id: e2e-diagnostics-action-signin-user-g
    direction: DOWN
    timeout: 60000
- tapOn:
    id: e2e-diagnostics-action-signin-user-g
- extendedWaitUntil:
    visible:
      id: e2e-diagnostics-action-signin-user-g
      enabled: true
    timeout: 60000
- scrollUntilVisible:
    element:
      id: e2e-diagnostics-action-create-place
    direction: DOWN
    timeout: 60000
- tapOn:
    id: e2e-diagnostics-action-create-place
- extendedWaitUntil:
    visible:
      id: e2e-diagnostics-action-create-place
      enabled: true
    timeout: 60000
- scrollUntilVisible:
    element:
      id: e2e-diagnostics-action-create-collection-with-place
    direction: DOWN
    timeout: 60000
- tapOn:
    id: e2e-diagnostics-action-create-collection-with-place
- extendedWaitUntil:
    visible:
      id: e2e-diagnostics-action-create-collection-with-place
      enabled: true
    timeout: 60000
- scrollUntilVisible:
    element:
      id: e2e-diagnostics-action-refresh
    direction: UP
    timeout: 60000
- tapOn:
    id: e2e-diagnostics-action-refresh
- scrollUntilVisible:
    element:
      id: e2e-diagnostics-count-saved-places
    direction: UP
    timeout: 60000
- assertVisible: "savedPlaces: 1"
- scrollUntilVisible:
    element:
      id: e2e-diagnostics-action-remove-latest-place-memberships
    direction: DOWN
    timeout: 60000
- tapOn:
    id: e2e-diagnostics-action-remove-latest-place-memberships
- extendedWaitUntil:
    visible:
      id: e2e-diagnostics-action-remove-latest-place-memberships
      enabled: true
    timeout: 60000
- scrollUntilVisible:
    element:
      id: e2e-diagnostics-action-refresh
    direction: UP
    timeout: 60000
- tapOn:
    id: e2e-diagnostics-action-refresh
- scrollUntilVisible:
    element:
      id: e2e-diagnostics-count-saved-places
    direction: UP
    timeout: 60000
- assertVisible: "savedPlaces: 0"
- stopApp
- launchApp
- tapOn:
    text: "Close app"
    optional: true
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible:
      id: e2e-home-root
    timeout: 60000
- openLink: bookmarks://diagnostics
- openLink: bookmarks://diagnostics
- extendedWaitUntil:
    visible:
      id: e2e-diagnostics-action-refresh
    timeout: 60000
- scrollUntilVisible:
    element:
      id: e2e-diagnostics-action-refresh
    direction: UP
    timeout: 60000
- tapOn:
    id: e2e-diagnostics-action-refresh
- scrollUntilVisible:
    element:
      id: e2e-diagnostics-count-saved-places
    direction: UP
    timeout: 60000
- assertVisible: "savedPlaces: 0"
