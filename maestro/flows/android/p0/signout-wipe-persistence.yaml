appId: com.sumitnarang76.bookmarksmobile
---
- launchApp:
    clearState: true
- openLink: bookmarks://diagnostics
- tapOn:
    id: e2e-diagnostics-action-signin-user-a
- tapOn:
    id: e2e-diagnostics-action-create-place
- tapOn:
    id: e2e-diagnostics-action-signout
- tapOn:
    id: e2e-diagnostics-action-refresh
- assertVisible: "activeUserId: local-guest-user"
- assertVisible: "hasAuthSession: false"
- assertVisible: "places: 0"
- assertVisible: "collections: 0"
- stopApp
- launchApp
- openLink: bookmarks://diagnostics
- tapOn:
    id: e2e-diagnostics-action-refresh
- assertVisible: "activeUserId: local-guest-user"
- assertVisible: "hasAuthSession: false"
