appId: com.sumitnarang76.bookmarksmobile
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: tab-map
    timeout: 60000
- openLink: bookmarks://diagnostics
- scrollUntilVisible:
    element:
      id: e2e-diagnostics-action-signin-user-a
    direction: DOWN
    timeout: 60000
- tapOn:
    id: e2e-diagnostics-action-signin-user-a
- extendedWaitUntil:
    visible:
      id: e2e-diagnostics-action-signin-user-a
      enabled: true
    timeout: 60000
- scrollUntilVisible:
    element:
      id: e2e-diagnostics-action-refresh
    direction: UP
    timeout: 60000
- tapOn:
    id: e2e-diagnostics-action-refresh
- scrollUntilVisible:
    element:
      id: e2e-diagnostics-active-user-id
    direction: UP
    timeout: 60000
- assertVisible: "activeUserId: e2e-user-a"
- assertVisible: "hasAuthSession: true"
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: tab-map
    timeout: 60000
- openLink: bookmarks://diagnostics
- scrollUntilVisible:
    element:
      id: e2e-diagnostics-action-refresh
    direction: UP
    timeout: 60000
- tapOn:
    id: e2e-diagnostics-action-refresh
- scrollUntilVisible:
    element:
      id: e2e-diagnostics-active-user-id
    direction: UP
    timeout: 60000
- assertVisible: "activeUserId: e2e-user-a"
- assertVisible: "hasAuthSession: true"
- scrollUntilVisible:
    element:
      id: e2e-diagnostics-action-run-sync
    direction: DOWN
    timeout: 60000
- tapOn:
    id: e2e-diagnostics-action-run-sync
- scrollUntilVisible:
    element:
      id: e2e-diagnostics-action-refresh
    direction: UP
    timeout: 60000
- tapOn:
    id: e2e-diagnostics-action-refresh
- scrollUntilVisible:
    element:
      id: e2e-diagnostics-has-auth-session
    direction: UP
    timeout: 60000
- assertVisible: "hasAuthSession: true"
